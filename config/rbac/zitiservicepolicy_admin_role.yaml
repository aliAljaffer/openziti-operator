# This rule is not used by the project ziti-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ziti.alialjaffer.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ziti-operator
    app.kubernetes.io/managed-by: kustomize
  name: zitiservicepolicy-admin-role
rules:
- apiGroups:
  - ziti.alialjaffer.com
  resources:
  - zitiservicepolicies
  verbs:
  - '*'
- apiGroups:
  - ziti.alialjaffer.com
  resources:
  - zitiservicepolicies/status
  verbs:
  - get
