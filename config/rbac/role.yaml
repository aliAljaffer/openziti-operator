  - get
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - alialjaffer.ziti
  resources:
  - zitiaccesspolicies
  - zitiapps
  - ziticas
  - ziticonfigs
  - ziticonnections
  - zitiedgerouterpolicies
  - zitiidentities
  - zitijwtsigners
  - zitirouters
  - zitiserviceedgerouterpolicies
