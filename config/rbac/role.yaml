---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ziti.alialjaffer.com
  resources:
  - ziticonnections
  - zitiservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ziti.alialjaffer.com
  resources:
  - ziticonnections/finalizers
  - zitiservices/finalizers
  verbs:
  - update
- apiGroups:
  - ziti.alialjaffer.com
  resources:
  - ziticonnections/status
  - zitiservices/status
  verbs:
  - get
  - patch
  - update
