apiVersion: ziti.alialjaffer.com/v1alpha1
kind: ZitiSidecar
metadata:
  labels:
    app.kubernetes.io/name: ziti-operator
    app.kubernetes.io/managed-by: kustomize
  name: zitisidecar-sample
spec:
  identityRef: zitiidentity-sample
  # Host is tproxy: the patched workload needs root, NET_ADMIN, and NET_RAW. Use Proxy when it cannot have those.
  mode: Host
  manifestSecretRef:
    namespace: default
    name: zitisidecar-sample-patch