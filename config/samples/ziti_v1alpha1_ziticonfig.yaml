apiVersion: ziti.alialjaffer.com/v1alpha1
kind: ZitiConfig
metadata:
  labels:
    app.kubernetes.io/name: ziti-operator
    app.kubernetes.io/managed-by: kustomize
  name: web-intercept
  namespace: default
spec:
  zitiName: web-intercept
  type: intercept.v1
  data:
    protocols:
      - tcp
    addresses:
      - web.example.com
    portRanges:
      - low: 443
        high: 443
