---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zitiidentities.ziti.alialjaffer.com
spec:
  group: ziti.alialjaffer.com
  names:
    categories:
    - ziti
    kind: ZitiIdentity
    listKind: ZitiIdentityList
    plural: zitiidentities
    shortNames:
    - ztid
    singular: zitiidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.managementPolicy
      name: Policy
      type: string
    - jsonPath: .status.enrolled
      name: Enrolled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.enrollmentExpiresAt
      name: Enrollment Expires
      type: string
    - jsonPath: .status.certNotAfter
      name: Cert Expires
      type: string
    - jsonPath: .status.activeSessions
      name: Sessions
      type: integer
    - jsonPath: .status.zitiId
      name: Ziti ID
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiIdentity is the Schema for the zitiidentities API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiIdentity
            properties:
              authPolicy:
                description: authPolicy is a Ziti auth policy name. It defaults to
                  "Default".
                type: string
              certificate:
                description: |-
                  certificate makes the operator create a cert-manager Certificate for this identity. Its common name is externalId
                  and it is stored in the Secret secretName (tls.crt, tls.key). The workload logs in with it.
                  The issuer must belong to a CA that a ZitiCA registered in Ziti. Needs enrollmentMode None and externalId.
                properties:
                  duration:
                    description: duration is the lifetime of the certificate. Empty
                      uses the cert-manager default (90 days).
                    type: string
                  issuerRef:
                    description: issuerRef names the cert-manager issuer that signs
                      the certificate.
                    properties:
                      kind:
                        default: ClusterIssuer
                        description: kind is Issuer or ClusterIssuer.
                        enum:
                        - Issuer
                        - ClusterIssuer
                        type: string
                      name:
                        description: name of the issuer.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - issuerRef
                type: object
              connectionRef:
                default: default
                description: connectionRef is the name of the ZitiConnection to use.
                  It defaults to "default".
                type: string
              deletionPolicy:
                default: Delete
                description: deletionPolicy does not apply to adopted identities.
                  Those are released, never deleted.
                enum:
                - Delete
                - Orphan
                type: string
              enrollmentMode:
                default: JwtOnly
                description: |-
                  enrollmentMode JwtOnly writes the enrollment JWT to the Secret. A person or workload enrolls with it.
                  OperatorEnrolled makes the operator enroll and write identity.json to the Secret.
                  None creates an identity without enrollment. It logs in with a token, so authPolicy is required.
                enum:
                - JwtOnly
                - OperatorEnrolled
                - None
                type: string
              externalId:
                description: |-
                  externalId is the value that a token claim must match to log in as this identity, for an identity provider
                  other than Kubernetes. It needs roleScope Global on the connection, because it can name any subject.
                maxLength: 1000
                type: string
              managementPolicy:
                default: Manage
                description: |-
                  managementPolicy Manage creates the identity. Adopt takes over an existing identity named zitiName. Set zitiName to the exact existing name, because the default name differs:
                  it adds ownership tags, sets roleAttributes and authPolicy, and never deletes the identity.
                  Observe only reads the existing identity and never writes to Ziti.
                enum:
                - Manage
                - Adopt
                - Observe
                type: string
              roleAttributes:
                description: roleAttributes follow the connection roleScope, like
                  ZitiApp roleAttributes.
                items:
                  type: string
                type: array
              secretName:
                description: secretName receives "enrollment.jwt" or "identity.json",
                  by enrollmentMode. It defaults to the CR name.
                maxLength: 253
                type: string
              serviceAccount:
                description: |-
                  serviceAccount is a ServiceAccount name in this namespace. Its token logs in to Ziti as this identity.
                  It sets externalId to system:serviceaccount:<namespace>:<name>. Needs a ZitiJwtSigner and an authPolicy that allows it.
                maxLength: 253
                type: string
              zitiName:
                description: zitiName defaults to <clusterId>-<namespace>-<name>.
                  Identities created before this default keep <namespace>.<name>.
                maxLength: 1000
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: zitiName is immutable
              rule: '!has(oldSelf.zitiName) || (has(self.zitiName) && self.zitiName
                == oldSelf.zitiName)'
            - message: deletionPolicy is immutable
              rule: self.deletionPolicy == oldSelf.deletionPolicy
            - message: enrollmentMode is immutable
              rule: self.enrollmentMode == oldSelf.enrollmentMode
            - message: set only one of serviceAccount and externalId
              rule: '!(has(self.serviceAccount) && has(self.externalId))'
            - message: certificate needs enrollmentMode None and externalId
              rule: '!has(self.certificate) || (self.enrollmentMode == ''None'' &&
                has(self.externalId))'
            - message: enrollmentMode None needs authPolicy and serviceAccount or
                externalId
              rule: self.enrollmentMode != 'None' || (has(self.authPolicy) && (has(self.serviceAccount)
                || has(self.externalId)))
          status:
            description: status defines the observed state of ZitiIdentity
            properties:
              activeSessions:
                description: activeSessions is the number of current client sessions
                  for this identity.
                format: int32
                type: integer
              certNotAfter:
                description: certNotAfter is the earliest expiry of the identity's
                  client certificates.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectedRouters:
                description: connectedRouters are the edge routers used by current
                  sessions for this identity.
                items:
                  type: string
                type: array
              connectedServices:
                description: connectedServices are the Ziti services with current
                  sessions for this identity.
                items:
                  type: string
                type: array
              enrolled:
                type: boolean
              enrollmentExpiresAt:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              zitiId:
                type: string
              zitiName:
                description: zitiName is the name the identity has in Ziti. It is
                  set once and does not change.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
