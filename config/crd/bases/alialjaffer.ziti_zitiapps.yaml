---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zitiapps.alialjaffer.ziti
spec:
  group: alialjaffer.ziti
  names:
    categories:
    - ziti
    kind: ZitiApp
    listKind: ZitiAppList
    plural: zitiapps
    shortNames:
    - ztapp
    singular: zitiapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.managementPolicy
      name: Policy
      type: string
    - jsonPath: .status.zitiName
      name: Ziti Name
      type: string
    - jsonPath: .status.conditions[?(@.type=='Hosted')].status
      name: Hosted
      type: string
    - jsonPath: .status.conditions[?(@.type=='Dialable')].status
      name: Dialable
      type: string
    - jsonPath: .status.conditions[?(@.type=='RoutePath')].status
      name: RoutePath
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiApp is the Schema for the zitiapps API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiApp
            properties:
              allow:
                description: allow creates a Dial policy for this app.
                properties:
                  groups:
                    description: groups are identity role attributes. Every identity
                      with one of them may connect.
                    items:
                      type: string
                    type: array
                  identities:
                    description: |-
                      identities are names of identities in Ziti. They may exist outside Kubernetes.
                      A name that does not exist yet is reported in the AccessResolved condition.
                    items:
                      type: string
                    type: array
                type: object
              connectionRef:
                default: default
                description: connectionRef is the name of the ZitiConnection to use.
                  It defaults to "default".
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy Delete removes the Ziti entities when this resource is deleted.
                  Orphan removes only the operator tags and keeps the entities. It cannot change after creation.
                enum:
                - Delete
                - Orphan
                type: string
              entryRouters:
                description: |-
                  entryRouters are the routers clients connect through. The hosting router is always allowed for the app.
                  When set, an edge router policy gives the allowed identities access to them.
                items:
                  type: string
                type: array
              expose:
                description: expose is how clients reach the app. It is required unless
                  managementPolicy is Observe.
                properties:
                  addresses:
                    description: addresses are the hostnames, IPs, or CIDRs clients
                      dial.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  ports:
                    description: |-
                      ports are port numbers or "low-high" ranges, for example [443, "8000-8005"].
                      The operator checks range syntax and reports InvalidSpec.
                    items:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
                      x-kubernetes-validations:
                      - message: a port is 1-65535
                        rule: type(self) != int || (self >= 1 && self <= 65535)
                    maxItems: 16
                    minItems: 1
                    type: array
                  protocols:
                    default:
                    - tcp
                    description: protocols the clients may use. The targets always
                      accept the same protocols.
                    items:
                      enum:
                      - tcp
                      - udp
                      type: string
                    minItems: 1
                    type: array
                required:
                - addresses
                - ports
                type: object
              hostedBy:
                description: |-
                  hostedBy is the router that runs the targets. It must be in the connection hostingRouters.
                  It defaults to the first entry.
                type: string
              managementPolicy:
                default: Manage
                description: |-
                  managementPolicy Manage creates and updates the Ziti entities. Adopt does the same, and also takes over
                  existing entities that have the names this app would create, replacing them with the desired state.
                  Adopted entities are released on delete, never deleted. Observe only reads the existing service
                  named zitiName and reports its status. It never writes to Ziti.
                enum:
                - Manage
                - Adopt
                - Observe
                type: string
              memberOf:
                description: |-
                  memberOf are groups the app belongs to. Existing policies that grant access to a group apply to it.
                  Groups follow the connection roleScope.
                items:
                  type: string
                type: array
              targets:
                description: targets are the places the app runs. Each one becomes
                  a terminator in Ziti.
                items:
                  description: Target is one place the app runs. Set exactly one of
                    address and kubernetesService.
                  properties:
                    address:
                      description: address is an IP or hostname the hosting router
                        can reach.
                      type: string
                    cost:
                      description: cost ranks targets. Ziti prefers the lowest cost.
                        Targets with equal cost share the load.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    kubernetesService:
                      description: kubernetesService is a Service name in this namespace.
                      type: string
                    port:
                      description: port on the target. Without it, the port the client
                        dialed is used.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of address and kubernetesService
                    rule: has(self.address) != has(self.kubernetesService)
                  - message: port is required with kubernetesService
                    rule: '!has(self.kubernetesService) || has(self.port)'
                maxItems: 16
                type: array
              zitiName:
                description: zitiName is the service name in Ziti. It defaults to
                  <namespace>.<name>.
                maxLength: 1000
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: zitiName is immutable
              rule: '!has(oldSelf.zitiName) || (has(self.zitiName) && self.zitiName
                == oldSelf.zitiName)'
            - message: deletionPolicy is immutable
              rule: self.deletionPolicy == oldSelf.deletionPolicy
            - message: expose and targets are required unless managementPolicy is
                Observe
              rule: self.managementPolicy == 'Observe' || (has(self.expose) && has(self.targets)
                && size(self.targets) > 0)
          status:
            description: status defines the observed state of ZitiApp
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ids:
                properties:
                  bind:
                    type: string
                  dial:
                    type: string
                  erp:
                    type: string
                  host:
                    type: string
                  intercept:
                    type: string
                  serp:
                    type: string
                  service:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              terminators:
                items:
                  properties:
                    router:
                      type: string
                  required:
                  - router
                  type: object
                type: array
              zitiName:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
