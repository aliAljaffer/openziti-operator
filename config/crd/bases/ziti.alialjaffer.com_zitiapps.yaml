---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zitiapps.ziti.alialjaffer.com
spec:
  group: ziti.alialjaffer.com
  names:
    kind: ZitiApp
    listKind: ZitiAppList
    plural: zitiapps
    shortNames:
    - ztapp
    singular: zitiapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.managementPolicy
      name: Policy
      type: string
    - jsonPath: .status.zitiName
      name: Ziti Name
      type: string
    - jsonPath: .status.conditions[?(@.type=='Hosted')].status
      name: Hosted
      type: string
    - jsonPath: .status.conditions[?(@.type=='Dialable')].status
      name: Dialable
      type: string
    - jsonPath: .status.conditions[?(@.type=='RoutePath')].status
      name: RoutePath
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiApp is the Schema for the zitiapps API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiApp
            properties:
              access:
                properties:
                  identityRoles:
                    description: identityRoles creates a Dial policy for this service
                      when set.
                    items:
                      type: string
                    type: array
                type: object
              connectionRef:
                default: default
                type: string
              deletionPolicy:
                default: Delete
                enum:
                - Delete
                - Orphan
                type: string
              edgeRouters:
                description: edgeRouters are extra entry routers. The hosting router
                  is always included.
                items:
                  type: string
                type: array
              host:
                description: Host sets the target. Set exactly one of serviceRef and
                  address.
                properties:
                  address:
                    type: string
                  forwardProtocol:
                    description: forwardProtocol true hosts every protocol in intercept.protocols.
                      False hosts only the first one.
                    type: boolean
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  serviceRef:
                    properties:
                      name:
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - name
                    - port
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of serviceRef and address
                  rule: has(self.serviceRef) != has(self.address)
                - message: port is required with address
                  rule: has(self.address) == has(self.port)
              hostingRouter:
                description: hostingRouter must be in the connection's hostingRouters.
                  It defaults to the first entry.
                type: string
              intercept:
                description: intercept and host are ignored when managementPolicy
                  is Observe.
                properties:
                  addresses:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  ports:
                    items:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    minItems: 1
                    type: array
                  protocols:
                    default:
                    - tcp
                    items:
                      enum:
                      - tcp
                      - udp
                      type: string
                    minItems: 1
                    type: array
                required:
                - addresses
                - ports
                type: object
              managementPolicy:
                default: Manage
                description: |-
                  managementPolicy Manage creates and updates the Ziti entities. Observe only reads the existing service
                  named zitiName and reports its status. It never writes to Ziti.
                enum:
                - Manage
                - Observe
                type: string
              roleAttributes:
                items:
                  type: string
                type: array
              zitiName:
                description: zitiName defaults to <namespace>.<name>.
                maxLength: 1000
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: zitiName is immutable
              rule: '!has(oldSelf.zitiName) || (has(self.zitiName) && self.zitiName
                == oldSelf.zitiName)'
            - message: deletionPolicy is immutable
              rule: self.deletionPolicy == oldSelf.deletionPolicy
            - message: more than one intercept protocol requires host.forwardProtocol
              rule: '!has(self.intercept) || !has(self.intercept.protocols) || size(self.intercept.protocols)
                < 2 || (has(self.host.forwardProtocol) && self.host.forwardProtocol)'
            - message: intercept and host are required unless managementPolicy is
                Observe
              rule: self.managementPolicy == 'Observe' || (has(self.intercept) &&
                has(self.host))
          status:
            description: status defines the observed state of ZitiApp
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ids:
                properties:
                  bind:
                    type: string
                  dial:
                    type: string
                  host:
                    type: string
                  intercept:
                    type: string
                  serp:
                    type: string
                  service:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              terminators:
                items:
                  properties:
                    router:
                      type: string
                  required:
                  - router
                  type: object
                type: array
              zitiName:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
