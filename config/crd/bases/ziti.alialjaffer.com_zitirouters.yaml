---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zitirouters.ziti.alialjaffer.com
spec:
  group: ziti.alialjaffer.com
  names:
    categories:
    - ziti
    kind: ZitiRouter
    listKind: ZitiRouterList
    plural: zitirouters
    shortNames:
    - ztrouter
    singular: zitirouter
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.enrolled
      name: Enrolled
      type: boolean
    - jsonPath: .status.online
      name: Online
      type: boolean
    - jsonPath: .status.enrollmentExpiresAt
      name: Enrollment Expires
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiRouter is the Schema for the zitirouters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiRouter
            properties:
              advertisedAddress:
                description: |-
                  advertisedAddress is the DNS name or IP where clients and other routers reach this router. The router needs it to start.
                  With enrollmentSecretRef and this field, the operator also writes ready-made "docker-compose.yml" and
                  "deployment.yaml" files to the Secret, so the router can be started on a VM or in a Kubernetes cluster without router configuration.
                  Without it, only the JWT is written and the condition ManifestsReady says why.
                maxLength: 253
                pattern: ^[A-Za-z0-9]([A-Za-z0-9.:-]*[A-Za-z0-9])?$
                type: string
              connectionRef:
                default: default
                description: connectionRef is the name of the ZitiConnection to use.
                  It defaults to "default".
                type: string
              cost:
                description: cost makes Ziti prefer routers with a lower cost.
                format: int32
                maximum: 65535
                minimum: 0
                type: integer
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy Delete removes the router from Ziti when this resource is deleted.
                  Orphan removes only the operator tags and keeps the router. It cannot change after creation.
                enum:
                - Delete
                - Orphan
                type: string
              disabled:
                description: disabled takes the router out of service without deleting
                  it.
                type: boolean
              enrollmentSecretRef:
                description: |-
                  enrollmentSecretRef names the Secret that receives the enrollment JWT under the key "enrollment.jwt".
                  Give it to the router at install, for example as the enrollmentJwt of the ziti-router Helm chart.
                  With advertisedAddress set, the Secret also holds the keys "docker-compose.yml" and "deployment.yaml".
                  The operator removes the key once the router has enrolled, and issues a new JWT when an unused one expires.
                  Without it, the JWT stays in Ziti.
                properties:
                  name:
                    description: name of the Secret.
                    type: string
                  namespace:
                    description: namespace of the Secret.
                    type: string
                required:
                - name
                - namespace
                type: object
              noTraversal:
                description: noTraversal keeps other traffic off this router. The
                  router only serves its own edge connections.
                type: boolean
              port:
                default: 3022
                description: port is the port the router listens on for clients and
                  links. It is used in the generated manifests.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              roleAttributes:
                description: |-
                  roleAttributes are the groups the router belongs to. Edge router policies select routers by them.
                  They are used as written, whatever the connection roleScope. Only cluster admins can create a ZitiRouter.
                items:
                  type: string
                type: array
              storageClassName:
                description: |-
                  storageClassName is the StorageClass of the volume in the generated deployment.yaml. Empty uses the cluster default.
                  Check its reclaim policy: with Retain, deleting the volume claim leaves the volume behind.
                maxLength: 253
                type: string
              tunnelerEnabled:
                description: tunnelerEnabled lets the router host and dial services
                  itself. Routers that host services need it.
                type: boolean
              zitiName:
                description: zitiName is the router name in Ziti. It defaults to the
                  resource name. It cannot change later.
                maxLength: 1000
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: zitiName is immutable
              rule: '!has(oldSelf.zitiName) || (has(self.zitiName) && self.zitiName
                == oldSelf.zitiName)'
            - message: deletionPolicy is immutable
              rule: self.deletionPolicy == oldSelf.deletionPolicy
          status:
            description: status defines the observed state of ZitiRouter
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              enrolled:
                description: enrolled is true once the router has enrolled with its
                  JWT.
                type: boolean
              enrollmentExpiresAt:
                description: enrollmentExpiresAt is when the pending JWT expires.
                  Empty once the router has enrolled.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              online:
                description: online is true while the router is connected to the controller.
                type: boolean
              routerId:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
