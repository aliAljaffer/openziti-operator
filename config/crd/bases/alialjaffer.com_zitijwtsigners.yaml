    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiJwtSigner is the Schema for the zitijwtsigners API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiJwtSigner
            properties:
              audience:
                description: audience must equal the aud claim of the tokens. Use
                  a value made for Ziti, for example "ziti".
                minLength: 1
                type: string
              claimsProperty:
                default: sub
                description: claimsProperty is the token claim that names the identity.
                type: string
              connectionRef:
                default: default
                description: connectionRef is the name of the ZitiConnection to use.
                  It defaults to "default".
                type: string
              createAuthPolicy:
                default: true
                description: |-
                  createAuthPolicy creates an auth policy with the same name that accepts only this signer.
                  Identities select it with spec.authPolicy.
                type: boolean
              deletionPolicy:
                default: Delete
