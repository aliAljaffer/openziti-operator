                  deletionPolicy Delete removes the Ziti entities when this resource is deleted.
                  Orphan removes only the operator tags and keeps the entities. It cannot change after creation.
                enum:
                - Delete
                - Orphan
                type: string
              keys:
                description: keys tells Ziti how to verify signatures.
                properties:
                  jwksEndpoint:
                    description: jwksEndpoint lets the Ziti controller fetch the keys,
                      for any identity provider.
                    properties:
                      issuer:
                        description: issuer must equal the iss claim of the tokens.
                        minLength: 1
                        type: string
                      url:
                        description: url is the JWKS endpoint. The Ziti controller
