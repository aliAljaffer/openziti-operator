                  False matches it to the identity id.
                type: boolean
              zitiName:
                description: zitiName is the signer name in Ziti. It defaults to the
                  resource name.
                maxLength: 1000
                minLength: 1
                type: string
            required:
            - audience
            - keys
            type: object
            x-kubernetes-validations:
            - message: zitiName is immutable
