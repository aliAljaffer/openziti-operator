                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              issuer:
                description: issuer is the token issuer that Ziti accepts.
                type: string
              keyId:
                description: keyId is the id of the signing key that Ziti uses. Empty
                  with jwksEndpoint.
                type: string
              observedGeneration:
                format: int64
                type: integer
              signerId:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
