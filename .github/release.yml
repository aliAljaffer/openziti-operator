changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Quality of Life
      labels:
        - qol
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
