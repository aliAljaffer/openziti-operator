name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the tests of the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sentinel="Data Hygiene"
          workflows=("Tests" "Lint" "Integration Tests" "E2E Tests" "Test Chart")
          deadline=$((SECONDS + ${VERIFY_TIMEOUT:-1800}))

          runs_of() {
            gh run list --repo "$REPO" --commit "$SHA" --workflow "$1" \
              --json status,conclusion --limit 20
          }
          succeeded() { jq -e 'any(.[]; .conclusion == "success")' >/dev/null <<<"$1"; }
          running() { jq -e 'any(.[]; .status != "completed")' >/dev/null <<<"$1"; }

          # Data Hygiene runs for every push to main, so it proves the commit
          # reached CI. A path-filtered workflow has no run at all, which must
          # not be mistaken for CI that never ran.
          while true; do
            runs=$(runs_of "$sentinel")
            if succeeded "$runs"; then
              break
            fi
            if [ "$(jq 'length' <<<"$runs")" -gt 0 ] && ! running "$runs"; then
              echo "::error::$sentinel did not pass for commit $SHA."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::CI for commit $SHA did not finish in time. Push the commit to main, wait for CI, then re-run this workflow."
              exit 1
            fi
            sleep 30
          done

          # Let the other workflows register before treating a missing run as a
          # path filter skip.
          sleep 30
          while true; do
            pending=0
            for wf in "${workflows[@]}"; do
              runs=$(runs_of "$wf")
              if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
                echo "$wf was skipped for $SHA, the changed paths do not need it"
                continue
              fi
              if succeeded "$runs"; then
                continue
              fi
              if running "$runs"; then
                pending=1
              else
                echo "::error::$wf did not pass for commit $SHA."
                exit 1
              fi
            done
            [ "$pending" -eq 0 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::CI for commit $SHA did not finish in time."
              exit 1
            fi
            sleep 30
          done
          echo "CI passed for $SHA"

  image:
    name: Build and push the image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package charts/chart --version "$version" --app-version "$version" --destination "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/ziti-operator-${version}.tgz" "oci://ghcr.io/${OWNER,,}/charts"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
