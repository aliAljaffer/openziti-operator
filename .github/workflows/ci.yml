name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while read -r f; do
            case "$f" in
              *.md|docs/*|.claude/*|.devcontainer/*|LICENSE|.gitignore|.github/FUNDING.yml|.github/ISSUE_TEMPLATE/*|.github/workflows/wiki.yml) ;;
              *) code=true ;;
            esac
          done < <(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "code=$code" >> "$GITHUB_OUTPUT"

  hygiene:
    name: Data Hygiene
    permissions:
      contents: read
    uses: ./.github/workflows/hygiene.yml
    secrets: inherit

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/integration.yml

  chart:
    name: Test Chart
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-chart.yml

  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-e2e.yml

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - hygiene
      - lint
      - test
      - integration
      - chart
      - e2e
      - security
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
