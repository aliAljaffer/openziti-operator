name: Integration Tests

on:
  workflow_call:

permissions: {}

jobs:
  integration:
    permissions:
      contents: read
    name: Real Ziti controller
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start a Ziti controller and router
        run: |
          docker run -d --name ziti -p 1280:1280 -p 3022:3022 openziti/ziti-cli:2.0.4 \
            edge quickstart --ctrl-address localhost --ctrl-port 1280 \
            --router-address localhost --password admin123
          for i in $(seq 1 60); do
            curl -ksf https://localhost:1280/edge/client/v1/version >/dev/null && exit 0
            sleep 2
          done
          docker logs ziti
          exit 1

      - name: Run integration tests
        env:
          ZITI_MGMT_URL: https://localhost:1280/edge/management/v1
          ZITI_USERNAME: admin
          ZITI_PASSWORD: admin123
        run: |
          sleep 20
          go test -tags integration -count=1 -skip '^TestControllers$' ./internal/...
