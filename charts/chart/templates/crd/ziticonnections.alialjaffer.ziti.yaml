{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: ziticonnections.alialjaffer.ziti
spec:
  group: alialjaffer.ziti
  names:
    categories:
    - ziti
    kind: ZitiConnection
    listKind: ZitiConnectionList
    plural: ziticonnections
    shortNames:
    - ztconn
    singular: ziticonnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.managementUrl
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Connected')].status
      name: Connected
      type: string
    - jsonPath: .status.controllerVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiConnection is the Schema for the ziticonnections API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiConnection
            properties:
              allowedNamespaces:
                description: allowedNamespaces selects the namespaces that may use
                  this connection. Empty selects all.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              auth:
                description: auth is how the operator logs in. Set exactly one of
                  updb and cert.
                properties:
                  cert:
                    description: |-
                      CertAuth reads the keys "tls.crt" and "tls.key" from the Secret, the format cert-manager writes.
                      The certificate must belong to a Ziti identity that may call the Edge Management API.
                    properties:
                      secretRef:
                        description: secretRef names the Secret with the keys tls.crt
                          and tls.key.
                        properties:
                          name:
                            description: name of the Secret.
                            type: string
                          namespace:
                            description: namespace of the Secret.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - secretRef
                    type: object
                  updb:
                    description: UpdbAuth reads the keys "username" and "password"
                      from the Secret.
                    properties:
                      secretRef:
                        description: secretRef names the Secret with the keys username
                          and password.
                        properties:
                          name:
                            description: name of the Secret.
                            type: string
                          namespace:
                            description: namespace of the Secret.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - secretRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of updb and cert
                  rule: has(self.updb) != has(self.cert)
              caBundle:
                description: caBundle holds the CA certificates that sign the controller
                  certificate.
                properties:
                  configMapRef:
                    description: configMapRef names the ConfigMap that holds the CA
                      certificates.
                    properties:
                      key:
                        description: key in the ConfigMap that holds the PEM certificates.
                        type: string
                      name:
                        description: name of the ConfigMap.
                        type: string
                      namespace:
                        description: namespace of the ConfigMap.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                required:
                - configMapRef
                type: object
              clusterId:
                default: default
                description: clusterId isolates operators that share one Ziti network,
                  for example staging and production.
                maxLength: 63
                pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                type: string
              defaultEdgeRouters:
                description: defaultEdgeRouters are router names added to every service
                  edge router policy.
                items:
                  type: string
                type: array
              hostingRouters:
                description: hostingRouters are the router names a ZitiApp may bind
                  through. The first entry is the default.
                items:
                  type: string
                minItems: 1
                type: array
              managementUrl:
                description: managementUrl is the Edge Management API URL, for example
                  https://controller:443/edge/management/v1.
                pattern: ^https://
                type: string
              roleScope:
                default: Namespaced
                description: roleScope Namespaced rewrites "#attr" to "#<namespace>.attr".
                  Global passes roles through unchanged.
                enum:
                - Namespaced
                - Global
                type: string
            required:
            - auth
            - caBundle
            - hostingRouters
            - managementUrl
            type: object
          status:
            description: status defines the observed state of ZitiConnection
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controllerVersion:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
