{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zitiaccesspolicies.ziti.alialjaffer.com
spec:
  group: ziti.alialjaffer.com
  names:
    categories:
    - ziti
    kind: ZitiAccessPolicy
    listKind: ZitiAccessPolicyList
    plural: zitiaccesspolicies
    shortNames:
    - ztap
    singular: zitiaccesspolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.zitiName
      name: Ziti Name
      type: string
    - jsonPath: .status.identities
      name: Identities
      type: integer
    - jsonPath: .status.services
      name: Services
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiAccessPolicy is the Schema for the zitiaccesspolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiAccessPolicy
            properties:
              connectionRef:
                default: default
                description: connectionRef is the name of the ZitiConnection to use.
                  It defaults to "default".
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy Delete removes the Ziti entities when this resource is deleted.
                  Orphan removes only the operator tags and keeps the entities. It cannot change after creation.
                enum:
                - Delete
                - Orphan
                type: string
              edgeRouters:
                description: edgeRouters are router names. When set, an edge router
                  policy gives the identities access to them.
                items:
                  type: string
                type: array
              identityRoles:
                description: identityRoles select the identities that may dial. Roles
                  follow the connection roleScope.
                items:
                  type: string
                minItems: 1
                type: array
              postureCheckRoles:
                description: postureCheckRoles add posture checks to the Dial policy.
                items:
                  type: string
                type: array
              serviceRoles:
                description: serviceRoles select the services they may dial. Roles
                  follow the connection roleScope.
                items:
                  type: string
                minItems: 1
                type: array
              zitiName:
                description: zitiName defaults to <namespace>.<name>. The Dial policy
                  is <zitiName>.dial and the router policy is <zitiName>.erp.
                maxLength: 1000
                minLength: 1
                type: string
            required:
            - identityRoles
            - serviceRoles
            type: object
            x-kubernetes-validations:
            - message: zitiName is immutable
              rule: '!has(oldSelf.zitiName) || (has(self.zitiName) && self.zitiName
                == oldSelf.zitiName)'
            - message: deletionPolicy is immutable
              rule: self.deletionPolicy == oldSelf.deletionPolicy
          status:
            description: status defines the observed state of ZitiAccessPolicy
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dialPolicyId:
                type: string
              edgeRouterPolicyId:
                type: string
              identities:
                description: identities is how many identities the Dial policy selects
                  now.
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              services:
                description: services is how many services the Dial policy selects
                  now.
                format: int32
                type: integer
              zitiName:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
