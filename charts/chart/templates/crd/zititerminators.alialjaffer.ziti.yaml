{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zititerminators.alialjaffer.ziti
spec:
  group: alialjaffer.ziti
  names:
    categories:
    - ziti
    kind: ZitiTerminator
    listKind: ZitiTerminatorList
    plural: zititerminators
    shortNames:
    - ztterm
    singular: zititerminator
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.service
      name: Service
      type: string
    - jsonPath: .spec.router
      name: Router
      type: string
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiTerminator is the Schema for the zititerminators API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiTerminator
            properties:
              address:
                description: address is where the router sends the traffic, for example
                  tcp:10.0.0.5:8443 or udp:10.0.0.5:53.
                pattern: ^(tcp|udp):[^:\s]+:[0-9]{1,5}$
                type: string
              binding:
                default: transport
                description: binding is the terminator binding. Keep the default unless
                  you know that you need another.
                minLength: 1
                type: string
              connectionRef:
                default: default
                description: connectionRef is the name of the ZitiConnection to use.
                  It defaults to "default".
                type: string
              cost:
                description: cost makes Ziti prefer terminators with a lower cost.
                format: int32
                maximum: 65535
                minimum: 0
                type: integer
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy Delete removes the terminator from Ziti when this resource is deleted.
                  Orphan removes only the operator tags and keeps the terminator. It cannot change after creation.
                enum:
                - Delete
                - Orphan
                type: string
              precedence:
                default: default
                description: 'precedence orders terminators: required first, default
                  next, failed last.'
                enum:
                - default
                - required
                - failed
                type: string
              router:
                description: router is the name of the edge router that forwards the
                  traffic.
                maxLength: 1000
                minLength: 1
                type: string
              service:
                description: |-
                  service is the name of the Ziti service. It must exist. The connection needs roleScope Global, because the name
                  can be any service in the network.
                maxLength: 1000
                minLength: 1
                type: string
            required:
            - address
            - router
            - service
            type: object
            x-kubernetes-validations:
            - message: service, router, and binding are immutable
              rule: self.service == oldSelf.service && self.router == oldSelf.router
                && self.binding == oldSelf.binding
          status:
            description: status defines the observed state of ZitiTerminator
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              zitiId:
                description: zitiId is the ID of the terminator in Ziti.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
