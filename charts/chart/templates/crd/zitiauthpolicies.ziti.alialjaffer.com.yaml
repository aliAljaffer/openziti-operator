  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zitiauthpolicies.ziti.alialjaffer.com
spec:
  group: ziti.alialjaffer.com
  names:
    categories:
    - ziti
    kind: ZitiAuthPolicy
    listKind: ZitiAuthPolicyList
    plural: zitiauthpolicies
    shortNames:
    - ztapolicy
    singular: zitiauthpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.zitiId
      name: Ziti ID
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZitiAuthPolicy is a Ziti auth policy, one to one.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ZitiAuthPolicy
            properties:
              connectionRef:
                default: default
                description: connectionRef is the name of the ZitiConnection to use.
                  It defaults to "default".
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy Delete removes the object from Ziti when this resource is deleted.
                  Orphan removes only the operator tags and keeps the object. It cannot change after creation.
                enum:
                - Delete
                - Orphan
                type: string
              managementPolicy:
                default: Manage
                description: |-
                  managementPolicy Manage creates the object. Adopt takes over an existing object named zitiName: it adds ownership
                  tags and updates only the fields this resource sets, and it is released on delete, never deleted.
                  Observe only reads the existing object and never writes to Ziti.
                enum:
                - Manage
                - Adopt
                - Observe
                type: string
              primary:
                description: primary sets the initial login method.
                properties:
                  cert:
                    description: cert controls certificate login.
                    properties:
                      allowExpiredCerts:
                        description: allowExpiredCerts accepts an expired certificate.
                          Leave false unless you need it for migration.
                        type: boolean
                      allowed:
                        default: true
                        description: allowed lets an identity log in with a certificate.
                        type: boolean
                    type: object
                  extJwt:
                    description: extJwt controls external JWT login.
                    properties:
                      allowed:
                        default: false
                        description: allowed lets an identity log in with an external
                          JWT.
                        type: boolean
                      allowedSigners:
                        description: allowedSigners are ZitiJwtSigner names. Empty
                          with allowed true accepts every enabled signer.
                        items:
                          type: string
                        type: array
                    type: object
                  updb:
                    description: updb controls username and password login.
                    properties:
                      allowed:
                        default: false
                        description: allowed lets an identity log in with a password.
                        type: boolean
                      lockoutDurationMinutes:
                        description: lockoutDurationMinutes is how long a locked account
                          stays locked. Zero uses the controller default.
                        format: int64
                        minimum: 0
                        type: integer
                      maxAttempts:
                        description: maxAttempts locks the account after this many
                          failures. Zero uses the controller default.
                        format: int64
                        minimum: 0
                        type: integer
                      minPasswordLength:
                        description: minPasswordLength is the shortest accepted password.
                        format: int64
                        minimum: 0
                        type: integer
                      requireMixedCase:
                        description: requireMixedCase requires upper and lower case
                          letters.
                        type: boolean
                      requireNumberChar:
                        description: requireNumberChar requires a digit.
                        type: boolean
                      requireSpecialChar:
                        description: requireSpecialChar requires a non-alphanumeric
                          character.
                        type: boolean
                    type: object
                type: object
              secondary:
                description: secondary sets the second factor.
                properties:
                  requireExtJwtSigner:
                    description: requireExtJwtSigner requires a JWT from this ZitiJwtSigner
                      on every request.
                    type: string
                  requireTotp:
                    description: requireTotp requires a time-based one-time password
                      after the primary login.
                    type: boolean
                type: object
              zitiName:
                description: zitiName is the name of the object in Ziti. It defaults
                  to <namespace>.<name>. It cannot change later.
                maxLength: 1000
                minLength: 1
                type: string
            type: object
          status:
            description: status defines the observed state of ZitiAuthPolicy
            properties:
              conditions:
                description: conditions report the state of the resource. Ready is
                  the summary.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata generation that this
                  status reflects.
                format: int64
                type: integer
              zitiId:
                description: zitiId is the ID of the object in Ziti.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
