{{- if or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled) }}
{{- if .Values.manager.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ziti-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "ziti-operator.resourceName" (dict "suffix" "controller-manager-pdb" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  maxUnavailable: {{ .Values.manager.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ziti-operator.name" . }}
      control-plane: controller-manager
{{- end }}
{{- end }}
