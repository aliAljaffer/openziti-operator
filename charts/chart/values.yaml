## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## Two replicas: one leader and one standby.
  replicas: 2

  image:
    repository: ghcr.io/alialjaffer/openziti-operator
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## Operator behavior. Each key maps to a manager flag.
##
operator:
  ## Rate limit for calls to the Ziti Edge Management API.
  zitiRequestsPerSecond: 10
  ## What to do with Ziti entities of this cluster whose owner resource is gone: report or delete.
  orphanPolicy: report
  ## How often to look for orphaned entities.
  orphanSweepInterval: 1h

## Connection to a Ziti controller. When create is true the chart creates the ZitiConnection.
## Without it, create the ZitiConnection yourself.
##
connection:
  create: false
  name: default
  ## Edge Management API URL. Required when create is true. Must start with https://
  managementUrl: ""
  ## Controller CA certificate. The ConfigMap must be in the release namespace.
  caBundle:
    configMapName: ziti-root-ca
    key: ca.crt
  ## Set exactly one of updb and cert. Both name an existing Secret in the release namespace.
  auth:
    updb:
      ## Secret with the keys username and password
      secretName: ""
    cert:
      ## Secret with the keys tls.crt and tls.key, for example from cert-manager
      secretName: ""
  ## Namespaced (default): a namespace only reaches its own role attributes. Global: roles pass through.
  roleScope: Namespaced
  ## Routers an app may run behind. The first one is the default. Required when create is true.
  hostingRouters: []
  defaultEdgeRouters: []
  ## Separates operators that share one Ziti network.
  clusterId: default
  ## Label selector. Only these namespaces may use the connection. Empty means all.
  # allowedNamespaces:
  #   matchLabels:
  #     ziti: enabled

## Copy the Ziti root CA into the release namespace with trust-manager.
## Requires trust-manager. The Bundle source Secret lives in the trust namespace (cert-manager by default).
##
trustManager:
  enabled: false
  ## Name of the Bundle and of the target ConfigMap. Match connection.caBundle.configMapName.
  name: ziti-root-ca
  key: ca.crt
  sources: []
  # sources:
  #   - secret: {name: ziti-controller-root-secret, key: ca.crt}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Limit Secret and ConfigMap access to these namespaces (the release namespace is always included).
  ## Empty grants cluster-wide access. Every namespace that holds a ZitiIdentity must be listed,
  ## because the operator writes identity Secrets there.
  secretNamespaces: []

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

