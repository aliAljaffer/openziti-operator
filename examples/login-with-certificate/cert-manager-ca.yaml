apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ziti-bootstrap
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ziti-workload-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ziti-workload-ca
  secretName: ziti-workload-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ziti-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ziti-workload-ca
spec:
  ca:
    secretName: ziti-workload-ca
