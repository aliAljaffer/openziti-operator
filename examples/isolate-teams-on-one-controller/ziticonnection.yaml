apiVersion: ziti.alialjaffer.com/v1alpha1
kind: ZitiConnection
metadata:
  name: shared
spec:
  managementUrl: https://ziti-controller-mgmt.example.com/edge/management/v1
  caBundle:
    configMapRef:
      namespace: ziti-operator-system
      name: ziti-root-ca
      key: ca.crt
  auth:
    updb:
      secretRef:
        namespace: ziti-operator-system
        name: ziti-operator-credential
  clusterId: teams
  roleScope: Namespaced
  allowedNamespaces:
    matchLabels:
      ziti-network: shared
  hostingRouters:
    - edge-1
  entryRouters:
    - edge-1
