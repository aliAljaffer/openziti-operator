apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-bot
  namespace: team-a
---
apiVersion: v1
kind: Pod
metadata:
  name: web-bot
  namespace: team-a
spec:
  serviceAccountName: web-bot
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl
      command:
        - sleep
        - "3600"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: ziti-token
          mountPath: /var/run/secrets/ziti
          readOnly: true
  volumes:
    - name: ziti-token
      projected:
        sources:
          - serviceAccountToken:
              audience: ziti
              expirationSeconds: 3600
              path: token
